[build]
  base = "."
  command = "rm -rf node_modules frontend/node_modules package-lock.json && npm install --include=optional && node scripts/netlify-install-native.js && npm run build --workspace=frontend"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

[[plugins]]
  package = "@netlify/plugin-nextjs"
