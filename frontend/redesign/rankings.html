<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04050d">
<title data-i18n="rankings.title">Rankings · STAVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Onest:wght@300..700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  :root { color-scheme: dark; }
  .pub { position: relative; z-index: 1; }

  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: end; margin-bottom: 48px; }
  .pod { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pod.r1 { --tone: var(--lime, #dceeb1); --size: 112px; --rise: 340px; }
  .pod.r2 { --tone: #cdd5ff; --size: 88px; --rise: 296px; }
  .pod.r3 { --tone: #4fd6c4; --size: 72px; --rise: 254px; }
  .bigstar { position: relative; width: var(--size); height: var(--size); color: var(--tone); }
  .bigstar::before { content: ""; position: absolute; inset: -45%; border-radius: 50%; background: radial-gradient(circle, var(--tone) 0%, transparent 62%); opacity: .26; animation: twinkle 7s ease-in-out infinite; }
  .r2 .bigstar::before { animation-delay: -2s; }
  .r3 .bigstar::before { animation-delay: -4s; }
  .bigstar svg { position: relative; width: 100%; height: 100%; fill: currentColor; }
  @keyframes twinkle { 50% { opacity: .42; transform: scale(1.08); } }
  .ped { position: relative; width: 100%; min-height: var(--rise); display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 26px 26px; border-radius: 24px; border: 1px solid var(--line); background: rgba(8,10,26,.66); box-shadow: inset 0 2px 0 var(--tone); }
  .pod .n { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -.04em; color: var(--tone); }
  .pod h2 { font-size: 24px; font-weight: 540; letter-spacing: -.01em; margin-top: 14px; }
  .pod h2 a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .pod .by { color: var(--soft); margin-top: 4px; font-size: 15px; }
  .pod .thumb { width: 100%; height: 56px; margin-top: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 10px; }
  .pod .stat { margin-top: 14px; font-size: 15px; color: var(--ink); }

  .rk { font-size: 18px; font-weight: 600; width: 56px; }
  .table tbody tr:hover td { background: rgba(255,255,255,.06); }
  .table .thumb { background: rgba(255,255,255,.03); border-color: var(--line); }
  .pill { background: rgba(255,255,255,.1); color: var(--soft); }

  .con { display: block; width: 100%; height: 100%; }
  .con .l0 { --c: var(--ink); }
  .con .l1 { --c: #4fd6c4; }
  .con .l2 { --c: #c58bd6; }
  .con .sl { stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .con .ed { fill: none; stroke: var(--c); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .con .st { fill: var(--c); transform-box: fill-box; transform-origin: center; }
  .con .st.hollow { fill: none; stroke: var(--c); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .con .ha { fill: var(--c); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .con .gl { opacity: .22; }
  .con .eg { opacity: .5; }
  .con .sg { opacity: .78; }
  .con :is(.gl, .eg, .sg, .st, .ha) { transition: opacity .5s ease-in, transform .5s ease-in; }
  .lit:is(:hover, :has(:focus-visible)) .con :is(.gl, .eg, .sg, .st, .ha) { transition-timing-function: ease-out; }
  .lit:is(:hover, :has(:focus-visible)) .con .gl { opacity: .5; }
  .lit:is(:hover, :has(:focus-visible)) .con :is(.eg, .sg) { opacity: 1; }
  .lit:is(:hover, :has(:focus-visible)) .con .st { transform: scale(1.3); }
  .lit:is(:hover, :has(:focus-visible)) .con .ha { opacity: .3; }

  .rise { animation: rise .9s ease-out both; animation-delay: calc(var(--i, 0) * 120ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

  @media (max-width: 960px) { .podium { grid-template-columns: 1fr; align-items: stretch; } .pod { flex-direction: row; align-items: flex-end; gap: 16px; } .bigstar { flex: none; } .ped { min-height: 0; } }
  @media (prefers-reduced-motion: reduce) { .rise, .bigstar::before { animation: none; } .con * { transition: none !important; } }
</style>
<script src="assets/i18n/en.js"></script>
<script src="assets/i18n/vi.js"></script>
<script src="assets/i18n.js"></script>
</head>
<body>
<canvas class="sky" data-sky="quiet" aria-hidden="true"></canvas>
<a class="skip" href="#main" data-i18n="common.skip">Skip to main content</a>
<div class="pub">
  <header id="pubtop" class="pub-top"></header>
  <main id="main">
    <div class="pub-head">
      <h1 class="pub-h1" data-i18n="shell.rankings">Rankings</h1>
      <p data-i18n="rankings.intro">Most-starred projects. Updated daily at 06:00, counted by new stars in the period you choose.</p>
    </div>

    <div class="tabs" id="periods">
      <a href="?p=tuan" data-key="tuan" aria-current="true" data-i18n="rankings.week">This week</a>
      <a href="?p=thang" data-key="thang" data-i18n="rankings.month">This month</a>
      <a href="?p=tat-ca" data-key="tat-ca" data-i18n="rankings.allTime">All time</a>
    </div>

    <section class="podium" aria-label="Top three projects" id="podium" data-i18n-attr="aria-label:rankings.top3"></section>

    <div class="table-wrap"><table class="table">
      <thead><tr><th data-i18n="rankings.thRank">Rank</th><th class="id" data-i18n="common.projects">Projects</th><th class="hide-s" data-i18n="common.genre">Genre</th><th class="r" data-i18n="rankings.thNew">New stars</th><th class="r hide-s" data-i18n="rankings.thTotal">Total stars</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </main>
  <footer class="pub-foot"><span data-i18n="shell.copyright">© 2026 STAVE</span><span><a href="explore.html" data-i18n="shell.explore">Explore</a> · <a href="help.html" data-i18n="shell.helpGlossary">Help and glossary</a></span></footer>
</div>
<script src="assets/shared.js"></script>
<script>
(function () {
  var S = window.STAVE;
  var T = {
    get rank() { return S.t("rankings.rank") + " "; },
    get gain() { return S.t("rankings.gain"); },
    get total() { return S.t("rankings.total"); }
  };
  var BIG_STAR = '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M50 0C52 34 66 48 100 50C66 52 52 66 50 100C48 66 34 52 0 50C34 48 48 34 50 0Z"/></svg>';

  function constellation(branches, merged, seed, W, H) {
    var lanes = Math.max(1, Math.min(3, branches));
    var main = 4 + (seed % 3);
    var x0 = W * 0.095, step = W * 0.81 / (main - 1);
    var fork = 1 + (seed % (main - 2));
    var r = Math.max(2.6, H * 0.05);
    var sp = Math.min(H * 0.075, H / (lanes + 1) / 3) / 2;
    var staff = "", edges = "", halos = "", stars = "", pos = [];
    for (var l = 0; l < lanes; l++) {
      var cy = H * (l + 1) / (lanes + 1), xs = [], p = [];
      for (var k = 0; k < 5; k++) { var ly = (cy + (k - 2) * sp).toFixed(1); staff += '<line class="sl" x1="' + (W * 0.04).toFixed(1) + '" x2="' + (W * 0.96).toFixed(1) + '" y1="' + ly + '" y2="' + ly + '"/>'; }
      if (l === 0) { for (var i = 0; i < main; i++) xs.push(x0 + i * step); }
      else { var n = 1 + ((seed + l) % 3); for (var j = 0; j < n; j++) xs.push(x0 + (fork + j + l - 1) * step + W * 0.048); var over = xs[n - 1] - W * 0.905; if (over > 0) xs = xs.map(function (x) { return x - over; }); }
      xs.forEach(function (x, idx) { p.push([x, cy + (((seed + idx * 3 + l) % 5) - 2) * sp]); });
      pos.push(p);
      edges += '<path class="ed l' + l + '" d="M' + p.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L") + '"/>';
      if (l > 0) {
        var a = pos[0][fork], b = p[0], mx = ((a[0] + b[0]) / 2).toFixed(1);
        edges += '<path class="ed l' + l + '" d="M' + a[0].toFixed(1) + " " + a[1].toFixed(1) + " C " + mx + " " + a[1].toFixed(1) + ", " + mx + " " + b[1].toFixed(1) + ", " + b[0].toFixed(1) + " " + b[1].toFixed(1) + '"/>';
      }
      p.forEach(function (q, idx) {
        var hollow = merged && l === 0 && idx === p.length - 1;
        halos += '<circle class="ha l' + l + '" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + (r * 3).toFixed(1) + '"/>';
        stars += '<circle class="st l' + l + (hollow ? " hollow" : "") + '" cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="' + r.toFixed(1) + '"/>';
      });
    }
    return '<svg class="con" viewBox="0 0 ' + W + " " + H + '" aria-hidden="true" focusable="false"><g class="gl">' + staff + '</g><g class="eg">' + edges + "</g>" + halos + '<g class="sg">' + stars + "</g></svg>";
  }

  S.mountPublicHeader("rankings");
  var p = new URLSearchParams(location.search).get("p") || "tuan";
  Array.prototype.forEach.call(document.querySelectorAll("#periods a"), function (a) { if (a.dataset.key === p) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current"); });
  var data = S.PUBLIC_PROJECTS;
  var mult = { tuan: 1, thang: 3.4, "tat-ca": 9 }[p] || 1;
  var order = [[3, 38], [1, 31], [0, 27], [4, 22], [7, 19], [2, 15], [5, 12], [6, 9]];
  var list = order.map(function (o) { return { d: data[o[0]], idx: o[0], gain: Math.round(o[1] * mult) }; });

  var pod = document.getElementById("podium");
  var firstDraw = true;
  function draw() {
  pod.textContent = "";
  document.getElementById("rows").textContent = "";
  list.slice(0, 3).forEach(function (r, i) {
    var a = document.createElement("article");
    a.className = "pod r" + (i + 1) + " lit" + (firstDraw ? " rise" : "");
    a.style.setProperty("--i", i);
    a.innerHTML = '<div class="bigstar" aria-hidden="true">' + BIG_STAR + '</div><div class="ped"><span class="n"><span class="sr-only">' + T.rank + "</span>" + (i + 1) + '</span><h2><a href="project.html">' + r.d[0] + '</a></h2><p class="by">' + r.d[4] + " · " + S.genre(r.d[2]) + '</p><div class="thumb">' + constellation(r.d[9], r.d[10], r.idx, 300, 56) + '</div><p class="stat"><b>+' + r.gain + "</b> " + T.gain + " · " + r.d[5] + " " + T.total + "</p></div>";
    pod.appendChild(a);
  });

  var rows = document.getElementById("rows");
  list.slice(3).forEach(function (r, i) {
    var tr = document.createElement("tr");
    tr.className = "lit";
    tr.innerHTML = '<td class="rk num">' + (i + 4) + '</td><td class="id"><div class="row-id"><div class="thumb">' + constellation(r.d[9], r.d[10], r.idx, 84, 46) + '</div><div><a href="project.html"><b>' + r.d[0] + "</b></a><span>" + r.d[4] + '</span></div></div></td><td class="hide-s"><span class="pill">' + S.genre(r.d[2]) + '</span></td><td class="r num"><b>+' + r.gain + '</b></td><td class="r num hide-s">' + r.d[5] + "</td>";
    rows.appendChild(tr);
  });
  firstDraw = false;
  }
  draw();
  document.addEventListener("stave:lang", draw);
})();
</script>
<script src="assets/sky.js" defer></script>
</body>
</html>
